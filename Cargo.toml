[package]
name = "voice-ai"
version = "2.5.0"
edition = "2021"
authors = ["TuNgocCoder <tudm.dev@gmail.com>"]
description = "High-Performance Voice AI Assistant Daemon & Fast-Path NLU in Rust"
license = "MIT"

[lib]
name = "voice_ai"
path = "src/lib.rs"

[[bin]]
name = "ai-assistant"
path = "src/bin/ai-assistant.rs"

[[bin]]
name = "voice-overlay"
path = "src/bin/voice-overlay.rs"

[[bench]]
name = "bench_nlu"
harness = false

[dependencies]
gtk4 = "0.11"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
unicode-normalization = "0.1"
strsim = "0.11"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
chrono = "0.4"
walkdir = "2.5"
rand = "0.8"
dirs = "6.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
